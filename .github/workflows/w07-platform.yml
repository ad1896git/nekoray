name: W07 teardown and Ubuntu evidence
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  teardown:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Deterministic held-sleep failure teardown
        run: python3 tests/test_w07_teardown.py tests/test_linux_vpn_script.py res/vpn/vpn-run-root.sh
