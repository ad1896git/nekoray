name: Go module verification

on:
  pull_request:
    paths:
      - 'go/**'
      - 'libs/verify_go_modules.sh'
      - '.github/workflows/go-module-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go-module-verification:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version: '1.22.12'
          cache: false
      - name: Fetch pinned sibling sources
        run: bash libs/get_source.sh
      - name: Download the existing core dependency graph
        working-directory: go/cmd/nekobox_core
        run: |
          cp go.mod "$RUNNER_TEMP/download.mod"
          cp go.sum "$RUNNER_TEMP/download.sum"
          go mod download -modfile="$RUNNER_TEMP/download.mod" all
      - name: Verify both modules with the explicit workspace
        run: bash libs/verify_go_modules.sh
      - name: Check manifests and default workspace discovery
        run: |
          git diff --exit-code -- 'go/**/go.mod' 'go/**/go.sum'
          test -z "$(cd go/cmd/nekobox_core && go env GOWORK)"
          test -z "$(cd go/grpc_server && go env GOWORK)"
