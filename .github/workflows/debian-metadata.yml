name: Debian metadata

on:
  pull_request:
    paths:
      - 'libs/package_debian.sh'
      - 'tests/test_package_debian.py'
      - '.github/workflows/debian-metadata.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debian-metadata:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    env:
      GOTOOLCHAIN: local
      NKR_TEST_REAL_DEB: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version: '1.22.12'
          cache: false
      - name: Build and inspect a real fixture package
        run: python3 tests/test_package_debian.py
