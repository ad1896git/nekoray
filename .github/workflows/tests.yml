name: Nekoray tests

# Remote CI only for major releases (tags v*) and manual runs. Routine checks run
# locally with .pipeline/ci_local.sh.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  linux-qt6:
    name: linux-qt6
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build and Qt runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build libglib2.0-bin desktop-file-utils \
            libgl1-mesa-dev libgstreamer-gl1.0-0 libpulse-dev \
            libxcb-glx0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-render0 \
            libxcb-shape0 libxcb-shm0 libxcb-sync1 libxcb-util1 \
            libxcb-xfixes0 libxcb-xinerama0 libxcb1 \
            libxkbcommon-dev libxkbcommon-x11-0 libxcb-xkb-dev \
            libxcb-cursor0

      - name: Install Qt 6.7.3
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: '6.7.3'
          host: linux
          target: desktop
          arch: linux_gcc_64
          dir: ${{ runner.temp }}/nkr-sdk
          install-deps: 'false'
          cache: 'false'
          aqtversion: '==3.3.0'

      - name: Verify SDK and tools
        run: |
          /usr/bin/cmake --version
          /usr/bin/ctest --version
          "$QT_ROOT_DIR/bin/qmake" -query QT_VERSION
          test "$("$QT_ROOT_DIR/bin/qmake" -query QT_VERSION)" = "6.7.3"
          for component in Core Widgets Network Svg LinguistTools Test; do
            test -f "$QT_ROOT_DIR/lib/cmake/Qt6${component}/Qt6${component}Config.cmake"
          done

      - name: Build protobuf for RPC tests
        run: |
          git clone --depth 1 --branch v21.4 \
            --recurse-submodules --shallow-submodules \
            https://github.com/protocolbuffers/protobuf.git \
            "$RUNNER_TEMP/nkr-pr10-protobuf-src"
          /usr/bin/cmake \
            -S "$RUNNER_TEMP/nkr-pr10-protobuf-src" \
            -B "$RUNNER_TEMP/nkr-pr10-protobuf-build" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -Dprotobuf_BUILD_TESTS=OFF \
            -Dprotobuf_WITH_ZLIB=OFF \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/nkr-pr10-protobuf-prefix"
          /usr/bin/cmake --build \
            "$RUNNER_TEMP/nkr-pr10-protobuf-build" --parallel 2
          /usr/bin/cmake --install \
            "$RUNNER_TEMP/nkr-pr10-protobuf-build"

      - name: Configure
        env:
          NKR_BUILD_DIR: ${{ runner.temp }}/nkr-pr0-qt6
        run: |
          /usr/bin/cmake -S "$GITHUB_WORKSPACE" -B "$NKR_BUILD_DIR" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DQt6_DIR="$QT_ROOT_DIR/lib/cmake/Qt6" \
            -DQT_VERSION_MAJOR=6 \
            -DNKR_NO_EXTERNAL=OFF \
            -DNKR_NO_GRPC=OFF \
            -DNKR_NO_YAML=ON \
            -DNKR_NO_ZXING=ON \
            -DNKR_NO_QHOTKEY=ON \
            -DNKR_LIBS="$RUNNER_TEMP/nkr-pr10-protobuf-prefix" \
            -DNKR_BUILD_TESTS=ON

      - name: Build
        env:
          NKR_BUILD_DIR: ${{ runner.temp }}/nkr-pr0-qt6
        run: /usr/bin/cmake --build "$NKR_BUILD_DIR" --parallel 2

      - name: Run tests
        env:
          NKR_BUILD_DIR: ${{ runner.temp }}/nkr-pr0-qt6
        run: |
          /usr/bin/ctest --test-dir "$NKR_BUILD_DIR" \
            --output-on-failure --no-tests=error --verbose

  linux-qt5:
    name: linux-qt5
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build and Qt runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build libglib2.0-bin desktop-file-utils \
            libgl1-mesa-dev libgstreamer-gl1.0-0 libpulse-dev \
            libxcb-glx0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-render0 \
            libxcb-shape0 libxcb-shm0 libxcb-sync1 libxcb-util1 \
            libxcb-xfixes0 libxcb-xinerama0 libxcb1 \
            libxkbcommon-dev libxkbcommon-x11-0 libxcb-xkb-dev

      - name: Install Qt 5.12.12
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: '5.12.12'
          host: linux
          target: desktop
          arch: gcc_64
          dir: ${{ runner.temp }}/nkr-sdk
          install-deps: 'false'
          cache: 'false'
          aqtversion: '==3.3.0'

      - name: Verify SDK and tools
        run: |
          /usr/bin/cmake --version
          /usr/bin/ctest --version
          "$QT_ROOT_DIR/bin/qmake" -query QT_VERSION
          test "$("$QT_ROOT_DIR/bin/qmake" -query QT_VERSION)" = "5.12.12"
          for component in Core Widgets Network Svg LinguistTools Test; do
            test -f "$QT_ROOT_DIR/lib/cmake/Qt5${component}/Qt5${component}Config.cmake"
          done

      - name: Build protobuf for RPC tests
        run: |
          git clone --depth 1 --branch v21.4 \
            --recurse-submodules --shallow-submodules \
            https://github.com/protocolbuffers/protobuf.git \
            "$RUNNER_TEMP/nkr-pr10-protobuf-src"
          /usr/bin/cmake \
            -S "$RUNNER_TEMP/nkr-pr10-protobuf-src" \
            -B "$RUNNER_TEMP/nkr-pr10-protobuf-build" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -Dprotobuf_BUILD_TESTS=OFF \
            -Dprotobuf_WITH_ZLIB=OFF \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/nkr-pr10-protobuf-prefix"
          /usr/bin/cmake --build \
            "$RUNNER_TEMP/nkr-pr10-protobuf-build" --parallel 2
          /usr/bin/cmake --install \
            "$RUNNER_TEMP/nkr-pr10-protobuf-build"

      - name: Configure
        env:
          NKR_BUILD_DIR: ${{ runner.temp }}/nkr-pr0-qt5
        run: |
          /usr/bin/cmake -S "$GITHUB_WORKSPACE" -B "$NKR_BUILD_DIR" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DQt5_DIR="$QT_ROOT_DIR/lib/cmake/Qt5" \
            -DQT_VERSION_MAJOR=5 \
            -DNKR_NO_EXTERNAL=OFF \
            -DNKR_NO_GRPC=OFF \
            -DNKR_NO_YAML=ON \
            -DNKR_NO_ZXING=ON \
            -DNKR_NO_QHOTKEY=ON \
            -DNKR_LIBS="$RUNNER_TEMP/nkr-pr10-protobuf-prefix" \
            -DNKR_BUILD_TESTS=ON

      - name: Build
        env:
          NKR_BUILD_DIR: ${{ runner.temp }}/nkr-pr0-qt5
        run: /usr/bin/cmake --build "$NKR_BUILD_DIR" --parallel 2

      - name: Run tests
        env:
          NKR_BUILD_DIR: ${{ runner.temp }}/nkr-pr0-qt5
        run: |
          /usr/bin/ctest --test-dir "$NKR_BUILD_DIR" \
            --output-on-failure --no-tests=error --verbose

  linux-go:
    name: linux-go
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
      CGO_ENABLED: '0'
      GOWORK: 'off'
      GOFLAGS: ''
      NKR_GO_TAGS: with_clash_api,with_gvisor,with_quic,with_wireguard,with_utls,with_ech

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Go 1.22.12
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.12'
          check-latest: false
          cache: false

      - name: Fetch pinned Go dependencies
        run: bash ./libs/get_source.sh

      - name: Verify dependency revisions
        run: |
          source libs/get_source_env.sh
          test "$(git -C ../sing-box rev-parse HEAD)" = "$COMMIT_SING_BOX"
          test "$(git -C ../sing-quic rev-parse HEAD)" = "$COMMIT_SING_QUIC"
          test "$(git -C ../libneko rev-parse HEAD)" = "$COMMIT_LIBNEKO"

      - name: Test core lifecycle
        working-directory: go/cmd/nekobox_core
        run: |
          go version
          go test -mod=readonly -tags "$NKR_GO_TAGS" \
            -count=1 -timeout=90s -v .

      - name: Build core
        working-directory: go/cmd/nekobox_core
        run: |
          go build -mod=readonly -tags "$NKR_GO_TAGS" \
            -trimpath -o "$RUNNER_TEMP/nekobox_core" .

      - name: Check dependency manifests remain unchanged
        run: |
          git diff --exit-code -- \
            go/cmd/nekobox_core/go.mod \
            go/cmd/nekobox_core/go.sum \
            go/grpc_server/go.mod \
            go/grpc_server/go.sum

  windows-build:
    name: windows-build (Qt 6.7 x64, portable package)
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      DL_QT_VER: '6.7'
      ACTIONS_ALLOW_UNSECURE_COMMANDS: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install MSVC compiler
        uses: ilammy/msvc-dev-cmd@v1
        with:
          toolset: 14.2
          arch: x64

      - name: Download Qt 6.7 SDK
        shell: bash
        run: bash ./libs/download_qtsdk_win.sh

      - name: Install ninja-build tool
        uses: seanmiddleditch/gha-setup-ninja@v3

      - name: Install Go 1.22.12
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.12'
          check-latest: false
          cache: false

      - name: Fetch pinned Go dependencies
        shell: bash
        run: ./libs/get_source.sh

      - name: Build third-party dependencies
        shell: bash
        run: ./libs/build_deps_all.sh

      - name: Build and deploy
        shell: bash
        env:
          CC: cl.exe
          CXX: cl.exe
        run: |
          source libs/env_qtsdk.sh $PWD/qtsdk/Qt
          mkdir build
          cd build
          cmake -GNinja -DQT_VERSION_MAJOR=6 -DCMAKE_BUILD_TYPE=Release ..
          ninja -j2
          cd ..
          ./libs/build_public_res.sh
          ./libs/deploy_windows64.sh

      # deploy_windows64.sh wipes the package directory, so Go binaries must be
      # added after it. Same flags and tags as libs/build_go.sh.
      - name: Add Go binaries to the package (windows/amd64)
        shell: bash
        run: |
          source libs/env_deploy.sh
          export CGO_ENABLED=0 GOOS=windows GOARCH=amd64
          DEST=$DEPLOYMENT/windows64
          pushd go/cmd/updater
          go build -o $DEST -trimpath -ldflags "-w -s"
          popd
          pushd go/cmd/nekobox_core
          go build -v -o $DEST -trimpath -ldflags "-w -s -X github.com/matsuridayo/libneko/neko_common.Version_neko=$version_standalone" -tags "with_clash_api,with_gvisor,with_quic,with_wireguard,with_utls,with_ech"
          popd
          ls -la $DEST/nekobox_core.exe $DEST/updater.exe

      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: nekoray-windows-x64-qt6.7
          path: deployment
          if-no-files-found: error
